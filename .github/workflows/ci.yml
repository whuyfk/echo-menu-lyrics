name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
      - name: Verify committed installable plugin
        run: npm run verify:package
      - name: Build native component from source
        run: node scripts/build.mjs --universal
      - name: Validate rebuilt distribution
        run: npm run package
