<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菜单栏歌词设置</title><style>/*__STYLE__*/</style></head><body><main><section id="launch-banner" class="launch-banner" role="alert" hidden><div class="launch-heading"><span class="launch-kicker">需要一次修复</span><h1 id="launch-title">菜单栏歌词没有启动</h1><p id="launch-message"></p></div><ol class="launch-steps"><li id="copy-step"><div><strong>先复制修复命令</strong><small id="copy-help">复制后，在 macOS「终端」中粘贴并回车。</small></div><button id="copy-repair" type="button">复制命令</button></li><li><div><strong>再重启菜单栏组件</strong><small id="restart-help">确认终端里的命令执行完成后，点击右侧按钮。</small></div><button id="restart-native" class="primary-action" type="button">我已执行，重启组件</button></li></ol><details><summary>查看修复命令</summary><code id="repair-command"></code></details></section><section class="preview"><small id="song">EchoMusic</small><div id="lyric">正在连接播放器…</div><div id="secondary"></div><div class="playback"><button data-command="togglePlayMode" id="play-mode" title="切换播放模式">↻</button><button data-command="previousTrack" title="上一首">⏮</button><button data-command="togglePlayback" id="play" title="播放／暂停">▶</button><button data-command="nextTrack" title="下一首">⏭</button><button data-command="toggleFavorite" id="favorite" title="收藏">♡</button></div></section><nav aria-label="设置分类"><button data-tab="display" aria-selected="true">显示</button><button data-tab="appearance" aria-selected="false">外观</button><button data-tab="lyrics" aria-selected="false">歌词与过滤</button></nav><form id="settings"></form><footer><span id="message" role="status">设置自动保存</span><span>EchoMusic · 菜单栏歌词</span></footer></main><script>/*__SCRIPT__*/</script></body></html>
